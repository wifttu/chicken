# Render Blueprint: 저장소를 연결하면 이 설정으로 게임 서버를 만든다.
services:
  - type: web
    name: kkokko-spy
    runtime: node
    plan: free
    region: singapore # 한국에서 가장 가까운 리전
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
